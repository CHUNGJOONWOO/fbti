<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FBTI — 나의 공정 감각 유형</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style id="pagestyle">@page{size:A4;margin:10mm}</style>
<style>
:root{
  --paper:#F2F4F6; --sheet:#FFFFFF; --ink:#1C2B39; --muted:#5E6B78; --rule:#CDD4DB; --track:#DCE1E6;
  --c1:#E04F3A; --c2:#1A9E8F; --c3:#D99520; --c4:#3D5BC4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121A21; --sheet:#1B252E; --ink:#E6ECF1; --muted:#9BA8B4; --rule:#33414D; --track:#2C3945;
    --c1:#FF7360; --c2:#3CC9B8; --c3:#F2B54B; --c4:#7B93F0;
  }
}
:root[data-theme="dark"]{
  --paper:#121A21; --sheet:#1B252E; --ink:#E6ECF1; --muted:#9BA8B4; --rule:#33414D; --track:#2C3945;
  --c1:#FF7360; --c2:#3CC9B8; --c3:#F2B54B; --c4:#7B93F0;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
.disp{font-family:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}
.wrap{max-width:640px;margin:0 auto;padding:18px 18px 56px}
.wide{max-width:1100px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c4);outline-offset:3px;border-radius:6px}
h1,h2,h3{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);
  padding:12px 22px;border-radius:999px;font-weight:700;cursor:pointer;min-height:50px}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:14px}
.linkbtn{background:none;border:0;padding:8px 4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;color:var(--muted);font-size:14px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:4px 0 16px}
.logo{font-size:22px;letter-spacing:.5px}
/* hero track */
.track svg{width:100%;height:auto;display:block}
.hero h1{font-size:clamp(32px,8.5vw,50px);line-height:1.15;margin:16px 0 10px}
.axislist{margin:20px 0 24px;padding:0;list-style:none;border-top:1px solid var(--rule)}
.axislist li{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule)}
.lane{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:6px;color:#fff;font-size:14px;margin-top:2px}
.teacher{margin-top:34px;padding-top:14px;border-top:2px solid var(--ink)}
.teacher h2{font-size:15px;margin-bottom:4px}
/* progress */
.progress{position:relative;height:24px;margin:4px 0 20px}
.progress .ln{position:absolute;left:0;right:0;top:9px;height:6px;background:var(--track);border-radius:3px}
.progress .fill{position:absolute;left:0;top:9px;height:6px;background:var(--ink);border-radius:3px;transition:width .3s}
.progress .fin{position:absolute;right:-2px;top:0;width:4px;height:24px;background:repeating-linear-gradient(var(--ink) 0 4px,var(--paper) 4px 8px)}
.pagelabel{font-size:14px;color:var(--muted);margin:-10px 0 14px}
.q{background:var(--sheet);border-radius:14px;padding:16px 16px 14px;margin-bottom:12px}
.q .num{font-size:13px;color:var(--muted)}
.q .txt{font-size:17px;font-weight:500;margin:2px 0 14px;line-height:1.55}
.q.att{outline:2px dashed var(--rule)}
.scale{display:flex;align-items:center;justify-content:space-between;position:relative;padding:0 2px}
.scale::before{content:"";position:absolute;left:18px;right:18px;top:50%;height:3px;background:var(--track);transform:translateY(-50%)}
.scale button{position:relative;border-radius:50%;border:3px solid var(--ink);background:var(--sheet);cursor:pointer;padding:0;transition:background .12s,transform .12s}
.scale button[data-v="1"],.scale button[data-v="7"]{width:40px;height:40px}
.scale button[data-v="2"],.scale button[data-v="6"]{width:33px;height:33px}
.scale button[data-v="3"],.scale button[data-v="5"]{width:27px;height:27px}
.scale button[data-v="4"]{width:22px;height:22px;border-color:var(--muted)}
.scale button[data-v="1"],.scale button[data-v="2"],.scale button[data-v="3"]{border-color:var(--muted)}
.scale button[aria-checked="true"]{background:var(--ink);transform:scale(1.08)}
.scale button[data-v="4"][aria-checked="true"],.scale button[data-v="1"][aria-checked="true"],.scale button[data-v="2"][aria-checked="true"],.scale button[data-v="3"][aria-checked="true"]{background:var(--muted)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:8px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.hint{font-size:14px;color:var(--c1);min-height:22px;margin-top:10px;text-align:right}
/* result */
.code{font-size:clamp(76px,24vw,124px);line-height:1;display:flex;gap:2px;margin:4px 0}
.nick{font-size:clamp(28px,7vw,38px);line-height:1.2;margin:4px 0 6px}
.tag{font-size:18px;margin:0 0 14px}
.emoji{font-size:46px;line-height:1}
.badge{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
.panel{background:var(--sheet);border-radius:14px;padding:16px;margin:18px 0}
.ax{margin:4px 0 16px}.ax:last-child{margin-bottom:2px}
.ax .top{display:flex;justify-content:space-between;font-size:14px;font-weight:500}
.ax .top .on{color:var(--ac);font-weight:700}
.ax .trk{position:relative;height:22px;margin:4px 0 2px}
.ax .trk .l{position:absolute;left:0;right:0;top:8px;height:6px;background:var(--track);border-radius:3px}
.ax .trk .f{position:absolute;top:8px;height:6px;background:var(--ac);border-radius:3px}
.ax .trk .ctr{position:absolute;left:50%;top:3px;width:2px;height:16px;background:var(--muted);transform:translateX(-1px)}
.ax .trk .m{position:absolute;top:1px;width:20px;height:20px;border-radius:50%;background:var(--sheet);border:5px solid var(--ac);transform:translateX(-10px)}
.ax .cap{font-size:13px;color:var(--muted)}
.sec{margin:24px 0}
.sec h3{font-size:18px;margin-bottom:8px}
.plain{list-style:none;padding:0;margin:0}
.plain li{padding:8px 0;border-bottom:1px dashed var(--rule)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sheet);border:1.5px solid var(--rule);border-radius:999px;padding:5px 12px;font-size:15px}
.callout{background:var(--sheet);border-radius:14px;padding:14px 16px;border-left:6px solid var(--c3)}
.warn{background:var(--sheet);border-radius:14px;padding:14px 16px;border-left:6px solid var(--c1);margin:14px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two button,.tcell{text-align:left;background:var(--sheet);border:2px solid var(--rule);border-radius:12px;padding:12px;cursor:pointer}
.two button:hover,.tcell:hover{border-color:var(--ink)}
.k{font-size:13px;color:var(--muted)}
.c{font-size:24px;display:block;margin:2px 0}
.grid16{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:540px){.grid16{grid-template-columns:repeat(4,1fr)}}
.tcell.mine{border-color:var(--ink)}
.grp{margin:20px 0 6px;font-size:15px;font-weight:700}




.bal{background:var(--sheet);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.bal .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bal .opts button{border:2px solid var(--rule);background:transparent;border-radius:10px;padding:10px;cursor:pointer;text-align:left}
.bal .opts button[aria-pressed="true"]{border-color:var(--ink);background:var(--paper)}
.bal .res{font-size:14px;margin-top:8px;min-height:20px}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--paper);padding:8px 10px;border-radius:8px;word-break:break-all}
input[type=text],input[type=number]{border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 10px}
.urltable{width:100%;border-collapse:collapse;font-size:14px}
.urltable td{border-bottom:1px solid var(--rule);padding:6px 4px;vertical-align:top}
.urltable td.u{word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
/* print: profile cards */
.cards{display:flex;flex-wrap:wrap;gap:4mm;justify-content:center}
.pcard{background:#fff;color:#1C2B39;border:.3mm solid #b8c2cb;border-radius:3mm;position:relative;overflow:hidden;break-inside:avoid;page-break-inside:avoid;font-size:calc(var(--w) * .052)}
.pcard .lanes{display:flex;height:calc(var(--w)*.05)}
.pcard .lanes i{flex:1}
.pcard .in{padding:calc(var(--w)*.06) calc(var(--w)*.07) 0}
.pcard .lab{font-size:.8em;color:#5E6B78;display:flex;justify-content:space-between}
.pcard .cc{font-family:"Black Han Sans","Malgun Gothic",sans-serif;font-size:calc(var(--w)*.21);line-height:1;margin:.25em 0 .1em;display:flex}
.pcard .em{position:absolute;right:calc(var(--w)*.07);top:calc(var(--w)*.2);font-size:calc(var(--w)*.1)}
.pcard .nn{font-family:"Black Han Sans","Malgun Gothic",sans-serif;font-size:1.55em;line-height:1.2}
.pcard .gg{font-size:.85em;margin-top:.2em}
.pcard .blank{position:absolute;left:calc(var(--w)*.07);right:calc(var(--w)*.07);bottom:calc(var(--w)*.07);font-size:.85em}
.pcard .draw{border:.3mm dashed #9aa6b1;border-radius:2mm;height:calc(var(--h)*.25);margin-bottom:.6em;display:flex;align-items:flex-end;justify-content:flex-end;padding:.3em;color:#9aa6b1;font-size:.8em}
.pcard .ln{border-bottom:.3mm solid #9aa6b1;height:1.6em;display:flex;align-items:flex-end;color:#5E6B78;font-size:.9em}
/* print: kit */
.kitcards{display:grid;grid-template-columns:repeat(3,63mm);gap:3mm;justify-content:center}
.kc{width:63mm;height:88mm;background:#fff;color:#1C2B39;border:.3mm solid #9aa6b1;border-radius:3mm;padding:5mm;position:relative;break-inside:avoid;page-break-inside:avoid;font-size:3.4mm;line-height:1.45}
.kc .t{font-size:2.8mm;color:#5E6B78}
.kc .h{font-family:"Black Han Sans","Malgun Gothic",sans-serif;font-size:6.5mm;line-height:1.15;margin:2mm 0 3mm}
.kc .b{font-size:3.4mm}
.kc .ft{position:absolute;left:5mm;right:5mm;bottom:4mm;font-size:2.6mm;color:#5E6B78;border-top:.3mm solid #CDD4DB;padding-top:1.5mm}
.kc .band{position:absolute;left:0;top:0;right:0;height:3mm}
.paper{background:#fff;color:#1C2B39;padding:10mm;width:190mm;font-size:2.9mm;line-height:1.45}
.paper h2{font-family:"Black Han Sans","Malgun Gothic",sans-serif;font-weight:400;font-size:7mm}
.paper table{width:100%;border-collapse:collapse;margin-top:2.5mm}
.paper td,.paper th{border:.25mm solid #9aa5a0;padding:.55mm 2mm;text-align:left}
.paper th{background:#eef1f4}
.paper td.box{width:12mm}
.sheet-preview{overflow-x:auto;padding-bottom:10px}
.boardwrap{overflow-x:auto}
.board{width:400mm;background:#fff}
.pagebreak{break-before:page;page-break-before:always}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  .wrap{max-width:none;padding:0;margin:0}
  :root{padding:0}
  .paper{padding:0;width:auto}
  .pcard,.kc,.board{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fadein{animation:fi .45s ease-out}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

<script>
(function(){
"use strict";
/* ============ 축 정의 ============ */
const AX=[
 {k:"MC",a:"M",b:"C",an:"노력",bn:"환경",ad:"성공은 주로 개인의 노력에서 나온다",bd:"성공에는 출발 조건과 환경이 크게 작용한다",t:"성공의 원인",v:"--c1",pc:"#E04F3A"},
 {k:"IS",a:"I",b:"S",an:"개인",bn:"사회",ad:"어려움은 먼저 개인과 가족이 해결해야 한다",bd:"어려움은 사회가 함께 책임져야 한다",t:"어려움의 책임",v:"--c2",pc:"#1A9E8F"},
 {k:"PB",a:"P",b:"B",an:"기여",bn:"균형",ad:"기여한 만큼 차등 보상하는 것이 공정하다",bd:"차이가 너무 커지지 않게 나누는 것이 공정하다",t:"공정한 분배",v:"--c3",pc:"#D99520"},
 {k:"RT",a:"R",b:"T",an:"경쟁",bn:"연대",ad:"경쟁이 사람과 사회를 성장시킨다",bd:"협력과 연대가 사람과 사회를 성장시킨다",t:"함께 사는 방식",v:"--c4",pc:"#3D5BC4"}
];
/* 축당 10문항(앞 글자 5 / 뒷 글자 5) */
const ITEMS={
 MC:[
  ["a","성공한 사람들은 대부분 남들보다 더 많이 노력한 사람들이다."],
  ["b","어떤 가정에서 태어나는지가 그 사람의 미래에 큰 영향을 준다."],
  ["a","가난에서 벗어나지 못하는 가장 큰 이유는 노력이 부족해서이다."],
  ["b","가난은 개인의 잘못보다 일자리나 임금 같은 사회 구조 때문에 생기는 경우가 많다."],
  ["a","지금 우리 사회는 노력한 만큼 결과를 얻을 수 있는 사회다."],
  ["b","같은 노력을 해도 사는 지역에 따라 얻을 수 있는 기회가 다르다."],
  ["a","시험 성적은 대체로 공부한 시간에 비례한다."],
  ["b","성공한 사람 중에는 운이나 좋은 환경 덕을 본 사람이 많다."],
  ["a","타고난 조건이 불리해도 의지가 강하면 대부분 극복할 수 있다."],
  ["b","사교육을 받을 수 있는지가 입시 결과에 큰 차이를 만든다."]
 ],
 IS:[
  ["a","생활이 어려워지면 정부보다 먼저 자기 자신과 가족이 해결해야 한다."],
  ["b","일자리를 잃은 사람이 기본적인 생활을 할 수 있게 돕는 것은 사회의 책임이다."],
  ["a","복지 혜택이 많아지면 사람들이 스스로 노력하지 않게 된다."],

  ["b","대학 등록금 부담은 사회가 함께 줄여 주어야 한다."],

  ["b","어려운 사람을 돕는 일을 개인의 선행에만 맡겨서는 안 된다."],
  ["a","자기 선택으로 생긴 어려움은 스스로 책임져야 한다."],
  ["b","아이들의 출발선을 비슷하게 맞추는 데 세금을 쓰는 것은 바람직하다."]
 ],
 PB:[
  ["a","더 많이 기여한 사람이 더 많이 가져가는 것이 공정하다."],
  ["b","우리 사회의 소득 차이는 지나치게 크다."],
  ["a","소득 차이가 있어야 사람들이 열심히 일한다."],
  ["b","가장 많이 버는 사람과 가장 적게 버는 사람의 차이는 줄어야 한다."],

 ],
 RT:[

  ["b","뒤처진 친구를 돕는 데 시간을 쓰는 것은 가치 있다."],

  ["b","내 몫이 조금 줄더라도 모두에게 좋은 쪽을 고르고 싶다."],

  ["b","어려울 때 서로 돕는 공동체가 사람을 더 강하게 만든다."]
 ]
};
const ATT={att:true,t:"이 문항은 응답 확인용이에요. ‘약간 그렇다’(오른쪽에서 세 번째)를 골라 주세요.",want:5};
const Q=[];
for(let i=0;i<10;i++){AX.forEach((ax,ai)=>{const it=ITEMS[ax.k][i];Q.push({ax:ai,p:it[0],t:it[1]});});}
Q.splice(20,0,ATT);
const PER=6, PAGES=Math.ceil(Q.length/PER);
const LIK=["전혀 아니다","아니다","약간 아니다","보통이다","약간 그렇다","그렇다","매우 그렇다"];

/* ============ 게임 직업군 ============ */

/* ============ 채점 ============ */
function score(ans){
  const axes=AX.map((ax,ai)=>{
    let s=0;
    Q.forEach((q,qi)=>{ if(q.att||q.ax!==ai) return; const v=ans[qi]-4; s+= q.p==="a"? v:-v; });
    const pctA=Math.round((s+30)/60*100), abs=Math.abs(s);
    return {s,pctA,letter:s>=0?ax.a:ax.b,clar: abs<=4?"경계":abs<=14?"보통":"뚜렷"};
  });
  const scored=ans.filter((_,i)=>!Q[i].att);
  const counts={}; scored.forEach(v=>counts[v]=(counts[v]||0)+1);
  const maxShare=Math.max(...Object.values(counts))/scored.length;
  const attIdx=Q.findIndex(q=>q.att);
  return {axes,code:axes.map(x=>x.letter).join(""),attOk:ans[attIdx]===ATT.want,flat:maxShare>=0.8,raw:ans.join("")};
}

}

function about(){
  app.innerHTML=bar()+`<h2 class="disp" style="font-size:28px">검사 설계 근거</h2>
  <div class="sec"><p style="margin:0">FBTI는 수업용으로 만든 태도 척도예요. 표준화 검사로 검증받은 도구는 아니며, 아래 원칙으로 문항과 채점을 설계했어요.</p></div>
  <div class="sec"><h3>구성 개념과 참고한 이론</h3><ul class="plain">
   <li><b>성공의 원인(M/C)</b> — 빈곤·성공에 대한 개인적 귀인과 구조적 귀인(Feagin, 1972), 공정한 세상 믿음(Lerner; Lipkus, 1991)</li>
   <li><b>어려움의 책임(I/S)</b> — 국제사회조사(ISSP) ‘정부의 역할’ 모듈의 정부 책임 문항 구성</li>
   <li><b>공정한 분배(P/B)</b> — 분배 정의의 형평·평등·필요 원칙(Deutsch, 1975), ISSP ‘사회 불평등’ 모듈의 소득 격차 인식 문항</li>
   <li><b>함께 사는 방식(R/T)</b> — 수직적 개인주의와 수평적 집단주의(Triandis &amp; Gelfand, 1998)</li></ul>
   <p class="small muted">원 문항을 그대로 옮기지 않고, 고등학생의 생활 장면에 맞게 새로 쓰거나 바꿔 썼어요.</p></div>
  <div class="sec"><h3>채점 방식</h3><ul class="plain">
   <li>축마다 10문항: 앞 글자 방향 5문항, 뒷 글자 방향 5문항(같은 쪽으로만 답하는 습관을 상쇄)</li>
   <li>7점 척도를 −3~+3으로 바꿔 앞 글자 문항은 더하고 뒷 글자 문항은 빼요. 축 점수 범위는 −30~+30이에요.</li>
   <li>0 이상이면 앞 글자, 0보다 작으면 뒷 글자예요. 비율 = (점수 + 30) ÷ 60 × 100</li>
   <li>|점수| 4 이하는 ‘경계’, 5~14는 ‘보통’, 15 이상은 ‘뚜렷’으로 표시해요.</li>
   <li>응답 확인 문항 1개(21번)와 같은 답 반복(80% 이상)을 감지해 다시 확인하도록 안내해요.</li></ul></div>
  <div class="sec"><h3>신뢰도·타당도를 확인하려면</h3><ul class="plain">
   <li><b>내적 일관성</b>: 결과 화면의 응답 기록 코드를 모아 축별 크론바흐 알파를 계산해요(뒷 글자 문항은 8에서 빼서 역채점). 0.7 이상이면 수업용으로 무난해요.</li>
   <li><b>검사–재검사</b>: 1~2주 뒤 다시 검사해 축 점수의 상관을 봐요.</li>
   <li><b>내용 타당도</b>: 사회과 교사 2~3명에게 문항이 해당 개념을 재는지 검토받아요.</li>
   <li><b>한계</b>: 표본이 작고 검증 전이므로 결과는 토론의 출발점으로만 쓰고, 학생을 평가하거나 분류하는 데 쓰지 않아요.</li></ul></div>`;
  window.scrollTo(0,0);
}

/* ============ 선생님: NFC 주소 ============ */
function nfc(){
  const saved=S.get("fbti-base")||location.href.split("#")[0].split("?")[0];
  app.innerHTML=bar()+`<h2 class="disp" style="font-size:28px">NFC 주소 목록</h2>
  <p class="small">NFC 카드에는 아래 주소를 기록해요. 이 파일을 올린 사이트 주소를 넣으면 유형별 주소가 만들어져요. 무료 앱 ‘NFC Tools’에서 ‘쓰기 → 레코드 추가 → URL’로 기록할 수 있어요.</p>
  <div class="row" style="margin:10px 0 14px"><input type="text" id="base" value="${esc(saved)}" style="flex:1;min-width:220px" aria-label="사이트 주소"><button class="btn ghost" data-act="base">주소 바꾸기</button></div>
  <table class="urltable"><tbody>${KEYS.map(k=>{const u=`${saved}#t=${k}`;return `<tr><td class="disp" style="font-size:18px">${codeSpans(k)}</td><td class="u">${esc(u)}</td><td><button class="linkbtn" data-copy="${esc(u)}">복사</button></td></tr>`}).join("")}</tbody></table>`;
}

/* ============ 선생님: 프로필 카드 인쇄 ============ */
let CW=54, CH=86, CN=1;
function cards(){
  setPage("A4");
  const list=[];KEYS.forEach(k=>{for(let i=0;i<CN;i++)list.push(k);});
  app.innerHTML=bar()+`<div class="noprint"><h2 class="disp" style="font-size:28px">프로필 카드 인쇄</h2>
  <p class="small">구입한 플라스틱 카드 크기에 맞춰 가로·세로(mm)를 바꾸세요. 아래쪽 그림 칸과 줄은 학생이 직접 꾸미는 빈칸이에요.</p>
  <div class="row small" style="margin:8px 0 14px"><label>가로 <input type="number" id="cw" value="${CW}" min="30" max="90" style="width:70px"> mm</label><label>세로 <input type="number" id="ch" value="${CH}" min="30" max="120" style="width:70px"> mm</label><label>유형별 장수 <input type="number" id="cn" value="${CN}" min="1" max="6" style="width:60px"></label><button class="btn ghost" data-act="cardsize">적용</button><button class="btn" data-act="print">인쇄하기</button></div></div>
  <div class="sheet-preview"><div class="cards">${list.map(k=>pcard(k)).join("")}</div></div>`;
}
function pcard(k){
  const t=T[k],g=gOf(k);
  return `<div class="pcard" style="--w:${CW}mm;--h:${CH}mm;width:${CW}mm;height:${CH}mm"><div class="lanes">${AX.map(a=>`<i style="background:${a.pc}"></i>`).join("")}</div>
  <div class="in"><div class="lab"><span>FBTI 프로필</span><span>${g.e} ${g.n}</span></div><div class="cc">${codeSpans(k,true)}</div><span class="em">${t[1]}</span>
  <div class="nn">${t[0]}</div><div class="gg">${esc(t[2])}</div></div>
  <div class="blank"><div class="draw">나를 그려 보세요</div><div class="ln">이름</div><div class="ln">나의 다짐</div></div></div>`;
}

/* ============ 선생님: 게임 카드 인쇄 ============ */
function kit(){
  setPage("A4");
  const cardsArr=[];
  START.forEach(s=>{for(let i=0;i<4;i++) cardsArr.push(kc("출발선 카드",`출발선 ${s[0]}`,`코인 ${s[1]}<br>정보 카드 ${s[2]}<br>인맥 카드 ${s[3]}`,"출발선은 뽑기로 정해요. 고를 수 없어요.","#1C2B39"));});
  EVENTS.forEach((e,i)=>cardsArr.push(kc(`사건 카드 ${i+1}`,e[0],e[1],"효과를 처리한 뒤 카드 더미 아래에 넣어요.","#E04F3A")));
  POLICY.forEach(p=>cardsArr.push(kc(`제도 카드 · ${p[1]}`,p[0],p[2],`필요한 세금 합계: ${p[3]}코인`,"#1A9E8F")));
  Object.values(G).forEach(g=>{for(let i=0;i<3;i++) cardsArr.push(kc("직업군 카드",`${g.e} ${g.n}`,`${esc(g.d)}<br><br><b>특수 능력</b><br>${esc(g.ab)}`,`정규직 ${g.tiers[0].replace("정규직 ","")} · 계약직 · 단기`,"#3D5BC4"));});
  const pages=[];for(let i=0;i<cardsArr.length;i+=9)pages.push(cardsArr.slice(i,i+9));
  app.innerHTML=bar()+`<div class="noprint"><h2 class="disp" style="font-size:28px">게임 카드 인쇄</h2>
  <p class="small">출발선 카드 12장(가·나·다 각 4), 사건 카드 14장, 제도 카드 7장, 직업군 카드 12장이 A4 ${pages.length}쪽에 들어가요. 모둠 수만큼 사건·제도 카드를 더 인쇄하세요.</p>
  <div class="row" style="margin:8px 0 14px"><button class="btn" data-act="print">인쇄하기</button></div></div>
  <div class="sheet-preview">${pages.map((pg,i)=>`<div class="kitcards ${i?"pagebreak":""}" style="${i?"margin-top:6mm":""}">${pg.join("")}</div>`).join("")}</div>`;
}
function kc(type,head,body,foot,color){return `<div class="kc"><div class="band" style="background:${color}"></div><div class="t" style="margin-top:2mm">${type}</div><div class="h">${head}</div><div class="b">${body}</div><div class="ft">${foot}</div></div>`;}

/* ============ 선생님: 게임 보드(A3) ============ */
function board(){
  setPage("A3 landscape");
  const W=400,cols=6,rows=5,cw=45,chh=46,ox=8,oy=24,gp=3;
  let cells="";
  for(let n=1;n<=30;n++){
    const r=Math.floor((n-1)/cols); let c=(n-1)%cols; if(r%2===1)c=cols-1-c;
    const x=ox+c*(cw+gp), y=oy+r*(chh+gp), d=CELLS[n], fill=CELLCOL[d[2]], dark=d[2]==="g";
    cells+=`<g><rect x="${x}" y="${y}" width="${cw}" height="${chh}" rx="3" fill="${fill}" stroke="#1C2B39" stroke-width=".4"/>
    <text x="${x+3}" y="${y+7}" font-size="5.5" font-weight="700" fill="${dark?"#fff":"#1C2B39"}">${n}</text>
    <text x="${x+cw/2}" y="${y+17}" font-size="6.3" text-anchor="middle" font-family="Black Han Sans, sans-serif" fill="${dark?"#fff":"#1C2B39"}">${d[0]}</text>
    ${wrapSVG(d[1],x+cw/2,y+24,cw-4,3.6,dark?"#fff":"#1C2B39")}</g>`;
  }
  const lx=ox+cols*(cw+gp)+8;
  const rules=["1. 출발선 카드를 뽑고 직업군 카드를 받는다.","2. 주사위만큼 이동한다.","   10·20칸 관문에서는 반드시 멈춘다.","3. 배움 칸: 코인을 내고 역량을 산다.","   (안 사도 된다)","4. 정보 카드 1장 = 진로 관문에서 역량 1","5. 첫 사람이 10칸에 오면 모두 멈추고","   마을 회의: 제도 카드 최대 2장과","   세금 내는 방식을 정한다.","6. 취업 관문 = 역량 + 인맥(+진학 길 1)","   6↑ 정규직 월급 6 · 3~5 계약직 4","   2↓ 단기 3","7. 월급날: 월급 받고 집(10코인) 구입 가능","   정규직은 5코인 + 대출(월급날마다 1, 3번)","8. 결산 = 코인 + 역량×2 + 집 8","9. 자녀 출발선","   16점↑ 가 · 10~15 나 · 9↓ 다"];
  const legend=`<g font-size="3.9" fill="#1C2B39"><text x="${lx}" y="${oy+6}" font-family="Black Han Sans, sans-serif" font-size="8">게임 규칙</text>
   ${rules.map((r,i)=>`<text x="${lx}" y="${oy+16+i*6.6}" xml:space="preserve">${esc(r)}</text>`).join("")}
   ${Object.entries({l:"배움",e:"사건",m:"용돈·알바",g:"관문",f:"마을 회의",p:"월급날",s:"기타"}).map(([k,v],i)=>`<rect x="${lx+(i%2)*46}" y="${oy+16+rules.length*6.6+4+Math.floor(i/2)*8}" width="5" height="5" fill="${CELLCOL[k]}" stroke="#1C2B39" stroke-width=".3"/><text x="${lx+(i%2)*46+7}" y="${oy+16+rules.length*6.6+8.2+Math.floor(i/2)*8}">${v}</text>`).join("")}</g>`;
  app.innerHTML=bar()+`<div class="noprint"><h2 class="disp" style="font-size:28px">게임 보드 인쇄 (A3 가로)</h2>
  <p class="small">인쇄 창에서 용지를 A3 가로로 맞추세요. A3가 없으면 A4 2장에 나눠 인쇄해 이어 붙여도 돼요.</p>
  <div class="row" style="margin:8px 0 14px"><button class="btn" data-act="print">인쇄하기</button></div></div>
  <div class="boardwrap"><svg class="board" viewBox="0 0 ${W} 277" xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans KR, Malgun Gothic, sans-serif">
   <text x="8" y="18" font-family="Black Han Sans, sans-serif" font-size="12" fill="#1C2B39">출발선이 다르다면? — 인생 보드</text>
   ${cells}${legend}

  </svg></div>`;
}
function wrapSVG(text,cx,y,maxW,fs,fill){
  const per=Math.floor(maxW/(fs*0.95)); const words=text.split(" "); const lines=[]; let cur="";
  words.forEach(w=>{ if((cur+" "+w).trim().length>per){ if(cur)lines.push(cur); cur=w; } else cur=(cur+" "+w).trim(); }); if(cur)lines.push(cur);
  return lines.slice(0,5).map((l,i)=>`<text x="${cx}" y="${y+i*(fs+1.2)}" font-size="${fs}" text-anchor="middle" fill="${fill}">${esc(l)}</text>`).join("");
}

/* ============ 선생님: 종이 검사지 ============ */
function sheet(){
  setPage("A4");
  const groups=AX.map((ax,ai)=>{const A=[],B=[];Q.forEach((q,qi)=>{if(!q.att&&q.ax===ai)(q.p==="a"?A:B).push(qi+1);});return {ax,A,B};});
  app.innerHTML=bar()+`<div class="noprint"><h2 class="disp" style="font-size:28px">종이 검사지</h2>
  <p class="small">기기를 쓸 수 없을 때 써요. 앞장은 문항, 뒷장은 채점표예요.</p><div class="row" style="margin:8px 0 14px"><button class="btn" data-act="print">인쇄하기</button></div></div>
  <div class="sheet-preview"><div class="paper"><h2>FBTI 공정 감각 유형 검사</h2>
  <p style="margin:1mm 0">이름 ____________ &nbsp; 각 문장이 내 생각과 얼마나 같은지 1~7 숫자로 쓰세요. 1 전혀 아니다 · 2 아니다 · 3 약간 아니다 · 4 보통 · 5 약간 그렇다 · 6 그렇다 · 7 매우 그렇다</p>
  <table><tbody>${Q.map((q,qi)=>`<tr><td style="width:7mm">${qi+1}</td><td>${esc(q.att?"이 문항은 응답 확인용이에요. 5를 쓰세요.":q.t)}</td><td class="box"></td></tr>`).join("")}</tbody></table>
  <div class="pagebreak"></div><h2 style="margin-top:3mm">채점표</h2>
  <p>① 축마다 앞 글자 문항 숫자의 합(가)과 뒷 글자 문항 숫자의 합(나)을 구해요. ② 가 − 나 가 0 이상이면 앞 글자, 0보다 작으면 뒷 글자예요. ③ 앞 글자 비율(%) = (가 − 나 + 30) ÷ 60 × 100</p>
  <table><thead><tr><th>축</th><th>앞 글자 문항</th><th>합(가)</th><th>뒷 글자 문항</th><th>합(나)</th><th>가−나</th><th>글자</th></tr></thead>
  <tbody>${groups.map(g=>`<tr><td>${g.ax.t}</td><td>${g.ax.a} ${g.ax.an}: ${g.A.join(", ")}</td><td class="box"></td><td>${g.ax.b} ${g.ax.bn}: ${g.B.join(", ")}</td><td class="box"></td><td class="box"></td><td class="box"></td></tr>`).join("")}</tbody></table>
  <p style="margin-top:4mm">나의 유형 ☐☐☐☐ · 별칭 ____________ · 게임 직업군(첫 글자+마지막 글자) ____________</p>
  <table><thead><tr><th>유형</th><th>별칭</th><th>유형</th><th>별칭</th></tr></thead><tbody>${Array.from({length:8},(_,i)=>`<tr><td>${KEYS[i]}</td><td>${T[KEYS[i]][0]}</td><td>${KEYS[i+8]}</td><td>${T[KEYS[i+8]][0]}</td></tr>`).join("")}</tbody></table>
  <p>직업군: M…R 개척자 · M…T 장인 · C…R 전략가 · C…T 연결자</p></div></div>`;
}
function setPage(sz){document.getElementById("pagestyle").textContent=`@page{size:${sz};margin:${sz.startsWith("A3")?"8mm":"10mm"}}`;}

/* ============ 라우팅 ============ */
function parseRoute(){
  const h=location.hash.slice(1), qs=new URLSearchParams(location.search);
  const m=h.match(/^t[=/]([A-Za-z]{4})/); if(m&&T[m[1].toUpperCase()]) return ["type",m[1].toUpperCase()];
  const qt=(qs.get("t")||"").toUpperCase(); if(!h&&T[qt]) return ["type",qt];
  const [v,arg]=(h||"home").split("/"); return [v,arg];
}
function go(view,arg){ location.hash = view==="type"? `t=${arg}` : (arg?`${view}/${arg}`:view); }
function render(){
  const [v,arg]=parseRoute();
  if(v!=="board"&&v!=="kit"&&v!=="cards"&&v!=="sheet") setPage("A4");
  ({test,result,types,about,nfc,cards,kit,board,sheet}[v]||(v==="type"?()=>typeView(arg):home))();
}
window.addEventListener("hashchange",render);

app.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.go){go(b.dataset.go);return;}
  if(b.dataset.type){go("type",b.dataset.type);return;}
  if(b.dataset.bal){
    const i=+b.dataset.bal, bq=BAL[i], code=(parseRoute()[1]||""), letter=code[bq.ax];
    b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    const typePick=letter===AX[bq.ax].a?"a":"b";
    document.getElementById("br"+i).innerHTML= (b.dataset.pick===typePick?`✔ 이 유형과 같은 선택이에요.`:`✦ 이 유형이라면 아마 ‘${esc(bq[typePick])}’를 골랐을 거예요.`)+` <span class="muted">(${AX[bq.ax].t}: ${letter} ${letter===AX[bq.ax].a?AX[bq.ax].an:AX[bq.ax].bn})</span>`;
    return;
  }
  if(b.dataset.copy){ const u=b.dataset.copy; (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>{b.textContent="복사됨";},()=>{prompt("주소를 복사하세요",u);}); return; }
  if(b.dataset.q){
    const qi=+b.dataset.q,v=+b.dataset.v; state.answers[qi]=v; S.set("fbti-progress",state);
    b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-checked",x===b));
    const h=document.getElementById("hint"); if(h)h.textContent=""; return;
  }
  const act=b.dataset.act;
  if(act==="prev"){state.page=Math.max(0,state.page-1);S.set("fbti-progress",state);test();}
  if(act==="next"){
    const from=state.page*PER,to=Math.min(from+PER,Q.length),miss=[];
    for(let i=from;i<to;i++) if(!state.answers[i]) miss.push(i+1);
    if(miss.length){document.getElementById("hint").textContent=`${miss.join(", ")}번 문항에 답해 주세요.`;return;}
    if(state.page<PAGES-1){state.page++;S.set("fbti-progress",state);test();}
    else{ const r=score(state.answers); S.set("fbti-result",r); state=blank(); S.del("fbti-progress"); go("result"); }
  }
  if(act==="retake"){state=blank();S.del("fbti-progress");go("test");}
  if(act==="print") window.print();
  if(act==="cardsize"){CW=+document.getElementById("cw").value||54;CH=+document.getElementById("ch").value||86;CN=Math.max(1,Math.min(6,+document.getElementById("cn").value||1));cards();}
  if(act==="base"){const v=document.getElementById("base").value.trim().split("#")[0]; if(v){S.set("fbti-base",v);} nfc();}
});
app.addEventListener("keydown",e=>{
  const b=e.target.closest(".scale button"); if(!b) return;
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();const n=e.key==="ArrowRight"?b.nextElementSibling:b.previousElementSibling;if(n){n.focus();n.click();}}
});
render();
